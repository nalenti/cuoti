<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamie 的错题本</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .subject-group {
            margin-bottom: 40px;
        }
        .subject-title {
            font-size: 20px;
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .card {
            background: #ffffff;
            padding: 0;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #eaeaea;
        }
        .card-header-topic {
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2f7 100%);
            padding: 14px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topic-badge {
            background: #4f46e5;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .topic-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }
        .card-body {
            padding: 18px 20px;
        }
        .question-text {
            font-size: 15px;
            color: #374151;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .analysis-box {
            background: #f9fafb;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 4px solid #4f46e5;
        }
        .error-reason {
            font-size: 14px;
            color: #dc2626;
        }
        .correct-solution {
            font-size: 14px;
            color: #059669;
        }
        .card-footer {
            padding: 12px 20px;
            background: #fcfcfc;
            border-top: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #6b7280;
        }
        .card-knowledge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .nav-btn {
            text-align: center;
            margin: 40px 0;
        }
        .nav-btn a {
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📚 Jamie 的错题本</h1>
    <div id="container">正在加载错题数据...</div>

    <div class="nav-btn">
        <a href="coco.html">👉 切换到 Coco 的错题本</a>
    </div>

    <script>
        // 核心记忆曲线筛选算法（安全版本）
        function getMemoryCurveQuestions(allQuestions) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const processed = allQuestions.map(q => {
                let dateStr = q.ReviewDate || '';
                // 纯字符串安全替换，不使用复杂正则
                dateStr = dateStr.split('年').join('-').split('月').join('-').split('日').join('');
                
                const targetDate = new Date(dateStr);
                targetDate.setHours(0, 0, 0, 0);
                
                const diffDays = isNaN(targetDate.getTime()) ? 0 : Math.round((today - targetDate) / (1000 * 60 * 60 * 24));
                return { ...q, diffDays };
            });

            let exactSeven = processed.filter(q => q.diffDays === 7);
            
            let selected = [];
            if (exactSeven.length > 0) {
                selected = exactSeven;
            } else {
                let olderThanSeven = processed.filter(q => q.diffDays > 7);
                if (olderThanSeven.length > 0) {
                    const minDiff = Math.min(...olderThanSeven.map(q => q.diffDays));
                    selected = olderThanSeven.filter(q => q.diffDays === minDiff);
                } else {
                    // 如果没有 7 天前或更早的（比如全都是最近 17、18 号的题），直接展示全部，保证不空屏
                    selected = processed;
                }
            }
            return selected;
        }

        function renderData(data) {
            const container = document.getElementById('container');
            
            const jamieData = data.filter(item => {
                const childVal = item.Child || '';
                return childVal.trim().toLowerCase() === 'jamie';
            });
            
            if (jamieData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">暂无 Jamie 的错题记录</p>';
                return;
            }

            const targetQuestions = getMemoryCurveQuestions(jamieData);

            if (targetQuestions.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">今日暂无符合复习周期的错题</p>';
                return;
            }

            const groupedData = {};
            targetQuestions.forEach(item => {
                const subject = item.Subject && item.Subject.trim() !== '' ? item.Subject.trim() : '未分类科目';
                if (!groupedData[subject]) {
                    groupedData[subject] = [];
                }
                groupedData[subject].push(item);
            });

            let htmlOutput = '';
            for (const [subject, items] of Object.entries(groupedData)) {
                htmlOutput += `
                    <div class="subject-group">
                        <div class="subject-title">📖 ${subject} (${items.length} 题)</div>
                        ${items.map(item => `
                            <div class="card">
                                <div class="card-header-topic">
                                    <span class="topic-badge">📌 核心考点</span>
                                    <h3 class="topic-title">${item.Pitfall || '综合应用与知识点'}</h3>
                                </div>
                                <div class="card-body">
                                    <div class="question-text">${item.Title || '无标题题目'}</div>
                                    <div class="analysis-box">
                                        <div class="error-reason">❌ <strong>错误原因：</strong> ${item.Reason || '无'}</div>
                                        <div class="correct-solution">✔️ <strong>正确解析：</strong> ${item.Analysis || '无'}</div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <span class="card-knowledge">🏷️ 类型: ${item.Knowledge || '未分类'}</span>
                                    <span>🕒 复习日：${item.ReviewDate \vert{}\vert{} '无'} (距今 ${item.diffDays} 天)</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = htmlOutput;

            if (window.MathJax) {
                MathJax.typesetPromise().catch((err) => console.log('MathJax 渲染错误:', err));
            }
        }

        fetch('jamie-data.json?' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                renderData(data);
            })
            .catch(err => {
                console.warn('获取数据失败:', err);
                container.innerHTML = '<p style="text-align:center; color:#e74c3c;">加载错题数据失败，请检查网络或 JSON 文件路径</p>';
            });
    </script>
</body>
</html>
