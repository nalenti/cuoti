<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamie 的错题本</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .subject-group { margin-bottom: 30px; }
        .subject-title { font-size: 20px; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-bottom: 15px; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #007bff; }
        .meta { color: #6c757d; font-size: 14px; margin-bottom: 10px; }
        .nav-btn { text-align: center; margin: 40px 0; }
        .nav-btn a { text-decoration: none; background: #007bff; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📚 Jamie 的错题本</h1>
    <div id="container">正在加载错题数据...</div>

    <div class="nav-btn">
        <a href="coco.html">👉 切换到 Coco 的错题本</a>
    </div>

    <script>
        fetch('jamie-data.json?' + new Date().getTime()) // 加上时间戳防止缓存
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('container');
                
                // 严格匹配 Child 为 Jamie（忽略大小写和前后空格）
                const jamieData = data.filter(item => {
                    const childVal = item.Child || '';
                    return childVal.trim().toLowerCase() === 'jamie';
                });
                
                if (jamieData.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">暂无 Jamie 的错题记录</p>';
                    return;
                }

                // 按照 Subject（科目）分组
                const groupedData = {};
                jamieData.forEach(item => {
                    const subject = item.Subject && item.Subject.trim() !== '' ? item.Subject.trim() : '未分类科目';
                    if (!groupedData[subject]) {
                        groupedData[subject] = [];
                    }
                    groupedData[subject].push(item);
                });

                // 渲染分类 HTML
                let htmlOutput = '';
                for (const [subject, items] of Object.entries(groupedData)) {
                    htmlOutput += `
                        <div class="subject-group">
                            <div class="subject-title">📖 ${subject} (${items.length} 题)</div>
                            ${items.map(item => `
                                <div class="card">
                                    <div class="meta">
                                        复习日：${item.ReviewDate || '无'}
                                    </div>
                                    <h3>${item.Title || '无标题'}</h3>
                                    <p><strong>错误原因：</strong> ${item.Reason || '无'}</p>
                                    <p><strong>知识点：</strong> ${item.Knowledge || '无'}</p>
                                    <p><strong>分析/解析：</strong> ${item.Analysis || '无'}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                container.innerHTML = htmlOutput;
            })
            .catch(err => {
                document.getElementById('container').innerHTML = '<p style="color:red; text-align:center;">加载数据失败</p>';
                console.error(err);
            });
    </script>
</body>

    </div>

    <script>
        // 辅助函数：安全提取 Notion 各种可能的字段格式（字符串或对象）
        function getVal(field) {
            if (!field) return '无';
            if (typeof field === 'string') return field;
            if (field.title && field.title.length > 0) return field.title[0].plain_text;
            if (field.rich_text && field.rich_text.length > 0) return field.rich_text[0].plain_text;
            if (field.select) return field.select.name;
            if (field.date) return field.date.start;
            return JSON.stringify(field);
        }

        fetch('jamie-data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('container');
                
                // 1. 过滤出 Jamie 的数据
                const jamieData = data.filter(item => {
                    const childObj = item.Child || item.child;
                    const childVal = getVal(childObj);
                    return childVal.trim().toLowerCase() === 'jamie';
                });
                
                if (jamieData.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">暂无 Jamie 的错题记录</p>';
                    return;
                }

                // 2. 按照科目（Subject）进行分组
                const groupedData = {};
                jamieData.forEach(item => {
                    const subject = getVal(item.Subject || item.subject) || '未分类科目';
                    if (!groupedData[subject]) {
                        groupedData[subject] = [];
                    }
                    groupedData[subject].push(item);
                });

                // 3. 渲染按科目分类的 HTML
                let htmlOutput = '';
                for (const [subject, items] of Object.entries(groupedData)) {
                    htmlOutput += `
                        <div class="subject-group">
                            <div class="subject-title">📖 ${subject} (${items.length} 题)</div>
                            ${items.map(item => `
                                <div class="card">
                                    <div class="meta">
                                        复习日：${getVal(item.ReviewDate || item.date)}
                                    </div>
                                    <h3>${getVal(item.Title || item.title || item.Name || item.name)}</h3>
                                    <p><strong>错误原因：</strong> ${getVal(item.Reason || item.reason)}</p>
                                    <p><strong>知识点：</strong> ${getVal(item.Knowledge || item.knowledge)}</p>
                                    <p><strong>分析/解析：</strong> ${getVal(item.Analysis || item.analysis)}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                container.innerHTML = htmlOutput;
            })
            .catch(err => {
                document.getElementById('container').innerHTML = '<p style="color:red; text-align:center;">加载数据失败</p>';
                console.error(err);
            });
    </script>
</body>
