<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamie 的错题本</title>
    <style>
        /* 基础页面排版 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ededed;
            color: #222222;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        /* 顶部横幅 */
        .top-banner {
            background-color: #f4f4f4;
            border: 1px solid #dcdcdc;
            border-radius: 14px;
            padding: 18px 28px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .top-left-area {
            display: flex;
            align-items: center;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        /* 切换开关 */
        .switcher-group {
            display: flex;
            background-color: #e0e0e0;
            padding: 3px;
            border-radius: 20px;
            gap: 2px;
        }
        .switcher-btn {
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            color: #666666;
            transition: all 0.2s ease;
        }
        .switcher-btn.active {
            background-color: #1a1a1a;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .switcher-btn:hover:not(.active) {
            color: #1a1a1a;
        }

        /* 底部深色质感卡片 */
        .bottom-banner {
            background-color: #262626;
            color: #ffffff;
            border-radius: 14px;
            padding: 22px 28px;
            margin-top: 50px;
            margin-bottom: 25px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        
        .flagday-section {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .date-number-block {
            display: flex;
            flex-direction: column;
            align-items: center;     
            justify-content: center;
            min-width: 65px;
            text-align: center;
        }

        .date-month-text {
            font-size: 11px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .date-day-num {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .date-divider {
            width: 2px;
            height: 38px;
            background-color: #555555;
            margin: 0 22px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .quote-content-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .quote-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .quote-desc {
            font-size: 12px;
            color: #a3a3a3;
            line-height: 1.4;
        }

        /* 科目与网格排版 */
        .subject-group {
            margin-bottom: 45px;
        }
        .subject-title {
            font-size: 19px;
            color: #333333;
            border-bottom: 2px solid #333333;
            padding-bottom: 8px;
            margin-bottom: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        /* ⭐️ 响应式网格：电脑端双列，手机端自动单列 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .card {
            background: #ffffff;
            padding: 0;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .card-header-topic {
            background: #f8f8f8;
            padding: 14px 20px;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topic-badge {
            background: #333333;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .topic-title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .card-body {
            padding: 18px 20px;
        }
        .question-text {
            font-size: 15px;
            color: #2c2c2c;
            line-height: 1.6;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .analysis-box {
            background: #f7f7f7;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 3px solid #333333;
        }
        .error-reason {
            font-size: 14px;
            color: #b91c1c;
            line-height: 1.5;
        }
        .correct-solution {
            font-size: 14px;
            color: #047857;
            line-height: 1.5;
        }
        .card-footer {
            padding: 12px 20px;
            background: #fafafa;
            border-top: 1px solid #eeeeee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666666;
        }
        .card-knowledge {
            background: #e5e5e5;
            color: #333333;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* 📱 移动端适配媒体查询：屏幕宽度 <= 768px 时 */
        @media screen and (max-width: 768px) {
            body {
                padding: 15px 12px;
            }
            .cards-grid {
                grid-template-columns: 1fr; /* 强制单列 */
                gap: 16px;
            }
            .top-banner {
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="top-banner">
        <div class="top-left-area">
            <span class="brand-title">错题本</span>
        </div>
        <div class="switcher-group">
            <a href="index.html" class="switcher-btn active">Jamie</a>
            <a href="coco.html" class="switcher-btn">Coco</a>
        </div>
    </div>
    
    <div id="container">正在加载错题数据...</div>

    <div class="bottom-banner">
        <div class="flagday-section">
            <div class="date-number-block">
                <span class="date-month-text" id="current-month">SEP</span>
                <span class="date-day-num" id="current-day">18</span>
            </div>
            <div class="date-divider"></div>
            <div class="quote-content-block">
                <div class="quote-title">Daily Inspiration & Review</div>
                <div class="quote-desc">“每一次认真的复习，都是对未来最好的投资。稳扎稳打，终将看见成效。”</div>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        document.getElementById('current-month').innerText = months[now.getMonth()];
        document.getElementById('current-day').innerText = now.getDate();

        function renderData(data) {
            const container = document.getElementById('container');
            container.innerHTML = '';
            
            const jamieData = data.filter(function(item) {
                const childVal = item.Child || '';
                return childVal.trim().toLowerCase() === 'jamie';
            });
            
            if (jamieData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">暂无 Jamie 的错题记录</p>';
                return;
            }

            const processedData = jamieData.map(function(item) {
                let diffDays = 0;
                const dateStr = item.ReviewDate || item['Review Date'];
                if (dateStr) {
                    const itemDate = new Date(dateStr);
                    if (!isNaN(itemDate)) {
                        diffDays = Math.floor((now - itemDate) / (1000 * 60 * 60 * 24));
                    }
                }
                return Object.assign({}, item, { diffDays: diffDays });
            });

            const greaterThanSix = processedData.filter(function(item) {
                return item.diffDays > 6;
            });

            if (greaterThanSix.length === 0) {
                container.innerHTML = '<div class="card" style="padding: 40px; text-align: center; color: #6b7280;">🎉 太棒了，暂无超过 6 天的历史错题需要复习！</div>';
                return;
            }

            const allDays = [];
            greaterThanSix.forEach(function(item) {
                if (allDays.indexOf(item.diffDays) === -1) {
                    allDays.push(item.diffDays);
                }
            });
            allDays.sort(function(a, b) { return a - b; });
            
            const targetDay = allDays[0];
            const targetList = greaterThanSix.filter(function(item) {
                return item.diffDays === targetDay;
            });

            const groupedData = {};
            targetList.forEach(function(item) {
                const subject = item.Subject && item.Subject.trim() !== '' ? item.Subject.trim() : '未分类科目';
                if (!groupedData[subject]) {
                    groupedData[subject] = [];
                }
                groupedData[subject].push(item);
            });

            let htmlOutput = '';
            for (const subject in groupedData) {
                if (Object.prototype.hasOwnProperty.call(groupedData, subject)) {
                    const items = groupedData[subject];
                    htmlOutput += '<div class="subject-group">';
                    htmlOutput += '<div class="subject-title">📖 ' + subject + ' (' + items.length + ' 题)</div>';
                    htmlOutput += '<div class="cards-grid">';
                    
                    for (let i = 0; i < items.length; i++) {
                        const item = items[i];
                        const pitfall = item.Pitfall && item.Pitfall.trim() !== '' ? item.Pitfall : '综合应用与知识点';
                        const title = item.Title && item.Title.trim() !== '' ? item.Title : '无标题题目';
                        const reason = item.Reason || item.Error || item.ErrorCause || '无';
                        const analysis = item.Analysis || '无';
                        const knowledge = item.Knowledge && item.Knowledge.trim() !== '' ? item.Knowledge : '未分类';
                        const reviewDate = item.ReviewDate || item['Review Date'] || '无';

                        htmlOutput += '<div class="card">';
                        htmlOutput += '<div>';
                        htmlOutput += '<div class="card-header-topic">';
                        htmlOutput += '<span class="topic-badge">📌 核心考点</span>';
                        htmlOutput += '<h3 class="topic-title">' + pitfall + '</h3>';
                        htmlOutput += '</div>';
                        htmlOutput += '<div class="card-body">';
                        htmlOutput += '<div class="question-text">' + title + '</div>';
                        htmlOutput += '<div class="analysis-box">';
                        htmlOutput += '<div class="error-reason">❌ <strong>错误原因：</strong> ' + reason + '</div>';
                        htmlOutput += '<div class="correct-solution">✔️ <strong>正确解析：</strong> ' + analysis + '</div>';
                        htmlOutput += '</div>';
                        htmlOutput += '</div>';
                        htmlOutput += '</div>';
                        
                        htmlOutput += '<div class="card-footer">';
                        htmlOutput += '<span class="card-knowledge">🏷️ 类型: ' + knowledge + '</span>';
                        htmlOutput += '<span>🕒 复习日：' + reviewDate + ' (错于 ' + item.diffDays + ' 天前)</span>';
                        htmlOutput += '</div>';
                        htmlOutput += '</div>';
                    }
                    htmlOutput += '</div>';
                    htmlOutput += '</div>';
                }
            }

            container.innerHTML = htmlOutput;
        }

        fetch('jamie-data.json?' + new Date().getTime())
            .then(function(response) {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(function(data) {
                renderData(data);
            })
            .catch(function(err) {
                console.warn('本地直接打开无法 fetch 外部 json, 已自动切换为内置测试数据预览：', err);
                const mockData = [
                    {
                        Child: "Jamie",
                        Subject: "英语",
                        Pitfall: "#英语翻译 #提建议句型 #宾语从句改疑问语序",
                        Knowledge: "英语核心句型与语法",
                        Title: "(豆包记录·翻译) ①这个周末为什么不和我们一起徒步呢？②你能教我怎么使用3D打印机吗？",
                        Reason: "提建议句型和“疑问词+不定式”结构不会用，容易写成中式英语。",
                        Analysis: "① Why not go hiking with us this weekend? ② Could you teach me how to use a 3D printer?",
                        ReviewDate: "2026-09-08"
                    },
                    {
                        Child: "Jamie",
                        Subject: "数学",
                        Pitfall: "#完全平方公式 #添括号法则 #公式变形",
                        Knowledge: "代数式恒等变形",
                        Title: "(4) 计算 88² 的简便方法",
                        Reason: "拆项与计算均错，心算或凑数过程逻辑不清。",
                        Analysis: "简便拆项：原式 = (90 - 2)² = 90² - 2×90×2 + 2² = 8100 - 360 + 4 = 7744",
                        ReviewDate: "2026-09-08"
                    }
                ];
                renderData(mockData);
            });
    </script>
</body>
</html>
