name: Sync Notion to JSON

on:
  schedule:
    # 对应北京时间每天 14:00 和 02:00 各执行一次 (UTC 06:00 和 18:00)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # 允许随时手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: |
          python sync.py

      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add jamie-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync Notion data" && git push)
