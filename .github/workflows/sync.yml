name: Sync Notion Data

on:
  workflow_dispatch: # 允许你在网页上一键手动触发同步
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动从 Notion 同步一次

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 执行同步脚本抓取 Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: |
          python -c '
          import urllib.request
          import json
          import os

          token = os.environ["NOTION_TOKEN"]
          db_id = os.environ["DATABASE_ID"]

          url = f"https://api.notion.com/v1/databases/{db_id}/query"
          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
          }

          req = urllib.request.Request(url, data=json.dumps({}).encode("utf-8"), headers=headers, method="POST")
          
          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode("utf-8"))
                  
                  parsed_questions = []
                  for page in res_data.get("results", []):
                      props = page.get("properties", {})
                      try:
                          name = props.get("Name", {}).get("title", [])
                          title_text = name[0]["plain_text"] if name else "无标题"
                          
                          child_select = props.get("Child", {}).get("select")
                          child = child_select["name"] if child_select else "Jamie"
                          
                          subject_select = props.get("Subject", {}).get("select")
                          subject = subject_select["name"] if subject_select else "数学"
                          
                          date_obj = props.get("ReviewDate", {}).get("date")
                          review_date = date_obj["start"] if date_obj else "2026-09-17"
                          
                          def get_text(prop_name):
                              rich = props.get(prop_name, {}).get("rich_text", [])
                              return rich[0]["plain_text"] if rich else ""

                          parsed_questions.append({
                              "id": page["id"],
                              "child": child,
                              "subject": subject,
                              "date": review_date,
                              "nextReviewDate": review_date,
                              "reasonType": get_text("Reason"),
                              "title": title_text,
                              "tags": [get_text("Knowledge")] if get_text("Knowledge") else [],
                              "errorCause": get_text("ErrorCause"),
                              "pitfall": get_text("Pitfall"),
                              "analysis": get_text("Analysis")
                          })
                      except Exception as e:
                          print(f"解析出错: {e}")

                  with open("jamie-data.json", "w", encoding="utf-8") as f:
                      json.dump(parsed_questions, f, ensure_ascii=False, indent=4)
                  print("同步成功！")
          except Exception as e:
              print(f"请求失败: {e}")
          '

      - name: 4. 自动提交并更新 JSON 文件到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git pull --rebase origin main || git pull --rebase origin master || true
          git add jamie-data.json
          git commit -m "Auto-sync Notion data" || echo "No changes to commit"
          git push origin HEAD:main || git push origin HEAD:master || true
