name: Sync GitHub Markdown to Notion

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请修改为 master
    paths:
      - 'study/**.md'  # 只有当 study 目录下的 md 文件有变动时才触发

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter

      - name: 4. 运行同步到 Notion 脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: |
          python sync_to_notion.py
