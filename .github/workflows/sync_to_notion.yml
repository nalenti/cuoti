name: Sync GitHub Markdown to Notion

on:
  push:
    branches:
      - main
    paths:
      - 'study/**.md'
  workflow_dispatch:  # <--- 加上这一行，就会在网页上出现“Run workflow”按钮！

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter

      - name: 4. 运行同步到 Notion 脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: |
          python sync_to_notion.py
